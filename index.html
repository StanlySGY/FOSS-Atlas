<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c0d" />
    <title>FOSS-Atlas · 开源白嫖资源图鉴</title>
    <meta
      name="description"
      content="FOSS-Atlas —— 导航 + Wiki + 知识图谱三合一的免费/开源资源库，收录 AI、SaaS、自部署、公开 API、安全工具等 165 个条目。"
    />

    <!--
      Chinese webfont, loaded *asynchronously*.

      The site is Chinese-first, but fonts.googleapis.com is unreachable from
      mainland China. A plain render-blocking `<link rel="stylesheet">` would
      stall first paint there until the request times out. The `media="print"`

      `onload` swap (a long-standing, well-supported pattern) fetches it off the
      critical path instead: the page paints immediately with the system CJK
      fallback in index.css, and the webfont upgrades the typography once — if —
      it arrives. A <noscript> keeps it working with JS disabled.

      unicode-range subsetting means only the glyph ranges actually used are
      downloaded; font-display:swap avoids invisible-text flashes.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
