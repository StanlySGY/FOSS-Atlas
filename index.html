<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c0d" />

    <!--
      No `rel=canonical`, no `og:*`, no `twitter:*` here on purpose: every route
      gets its own set from scripts/prerender.mjs (the copy lives in
      src/prerender/site.js), and a second set authored here would be a second
      canonical per document, which is worse than none. The build strips anything
      like this from the head before re-emitting it, so adding them here would be
      silently overwritten rather than duplicated — but the title and description
      directly below *are* checked against site.js, so keep those in step.
    -->
    <title>FOSS-Atlas · 开源白嫖资源图鉴</title>
    <meta
      name="description"
      content="免费额度、自部署方案、公开 API 收进一张可搜索、可漫游的图：186 个开源条目，导航、Wiki、知识图谱三合一。"
    />

    <!--
      Self-hosted, subsetted Chinese webfont (scripts/build-fonts.mjs).

      The bytes live in public/fonts/ and ship with the site, so there is no
      runtime dependency on fonts.googleapis.com — which is unreachable from
      mainland China, this catalogue's main audience. Preloading the three faces
      starts the fetch in parallel with the bundle; font-display:swap means text
      paints immediately in the platform CJK fallback either way.
    -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/noto-sans-sc-400.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/noto-sans-sc-700.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
