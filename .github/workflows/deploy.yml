name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the workflow to publish to Pages and mint an OIDC token for deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The catalogue JSON is committed, so a PR that edits the hand-written
      # sources without re-running the generator would ship stale JSON. Regenerate
      # and fail if the working tree moved — except for `generated_at`, which the
      # generator stamps on every run and is therefore never a real change.
      - name: Check committed data is in sync
        run: |
          npm run data
          drift=$(git diff -U0 src/data | grep -E '^[+-][^+-]' | grep -v generated_at)
          if [ -n "$drift" ]; then
            echo "::error file=src/data::src/data is out of sync with the generators. Run \`npm run data\` and commit the regenerated JSON."
            echo "$drift"
            exit 1
          fi

      - name: Build
        env:
          # Project site → served from /<repo>/. Set to "/" for a custom domain
          # or a user/org page.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
