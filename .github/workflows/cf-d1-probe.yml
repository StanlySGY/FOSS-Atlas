name: CF D1 capability probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe D1 API
        run: |
          set +e
          echo "account_set=$([ -n "$CLOUDFLARE_ACCOUNT_ID" ] && echo yes || echo no)"
          echo "token_set=$([ -n "$CLOUDFLARE_API_TOKEN" ] && echo yes || echo no)"
          code=$(curl -s -o /tmp/d1.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")
          echo "http=$code"
          python3 - <<'PY'
          import json
          try:
              d=json.load(open('/tmp/d1.json'))
          except Exception:
              print('unparseable'); raise SystemExit(0)
          print('success=', d.get('success'))
          print('errors=', [ (e.get('code'), e.get('message')) for e in d.get('errors',[]) ])
          print('databases=', [x.get('name') for x in d.get('result') or []])
          PY
