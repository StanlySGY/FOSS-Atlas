name: Cloudflare capability probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Probe endpoints
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing secret::CLOUDFLARE_API_TOKEN is not set."
            exit 1
          fi
          api="https://api.cloudflare.com/client/v4"
          {
            echo "| 端点 | HTTP |"
            echo "| --- | --- |"
            for ep in \
              "user/tokens/verify" \
              "accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts" \
              "accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" \
              "accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" \
              "accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
            do
              code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api/$ep")"
              echo "| \`$ep\` | $code |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "probe finished"

      - name: List D1 databases
        run: |
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" > /tmp/d1.json || true
          api="https://api.cloudflare.com/client/v4"
          curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" > /tmp/d1.json || true
          node -e '
            const fs = require("fs");
            const raw = fs.readFileSync("/tmp/d1.json", "utf8");
            let data;
            try { data = JSON.parse(raw); } catch { console.log("non-JSON response"); process.exit(0); }
            if (!data.success) { console.log("success=false"); process.exit(0); }
            const rows = (data.result || []).map((d) => `| \`${d.name}\` | \`${d.uuid}\` |`);
            console.log(rows.length ? rows.join("\n") : "(no databases)");
          '
