name: Build & Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a publish that is half-way through.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Cloudflare Pages serves this project from the domain root, while the
      # GitHub Pages build stays on /FOSS-Atlas/. VITE_BASE picks the base path
      # at build time, so no source change is needed per target.
      VITE_BASE: /
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        run: npm test && npm run lint

      # Same gate as the GitHub Pages workflow: it is a different deploy of the
      # same commit, so it must not publish a JSON snapshot that the generator
      # would disagree with.
      - name: Check committed data is in sync
        run: |
          npm run data
          # `|| true`: with no drift the last grep matches nothing and exits 1, and the step runs
          # under `bash -e` — so an empty result would fail the job as if data had moved.
          drift=$(git diff -U0 src/data | grep -E '^[+-][^+-]' | grep -v generated_at || true)
          if [ -n "$drift" ]; then
            echo "::error file=src/data::src/data is out of sync with the generators. Run \`npm run data\` and commit the regenerated JSON."
            echo "$drift"
            exit 1
          fi

      - name: Check graph views match their claims
        # Same guard as the GitHub Pages job: both hosts ship the same graph.
        run: npm run views:check

      - name: Build
        # Cloudflare Pages answers unknown paths from index.html with a 200, but
        # only when there is no 404.html in the upload — so skip the GitHub
        # Pages fallback file here.
        env:
          SKIP_SPA_FALLBACK: "1"
        run: npm run build

      - name: Probe self-hosted services
        # Same snapshot the GitHub Pages deploy ships, written into dist/ after
        # the build so it is not wiped by it and never committed.
        run: npm run probe -- --out dist/probe.json || echo "::warning title=Probe failed::publishing without probe.json"

      - name: Check Cloudflare credentials
        id: creds
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Cloudflare Pages skipped::Add the CLOUDFLARE_API_TOKEN repository secret to enable the Cloudflare Pages deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.creds.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=foss-atlas --branch=main
